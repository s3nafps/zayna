name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zayna
          POSTGRES_USER: zayna
          POSTGRES_PASSWORD: zayna_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zayna -d zayna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # CI-only values for a throwaway database. They are not real credentials.
      DATABASE_URL: postgresql://zayna:zayna_ci@localhost:5432/zayna?schema=public
      AUTH_SECRET: ci-only-auth-secret-at-least-thirty-two-characters
      ADMIN_SEED_EMAIL: owner@zayna.test
      ADMIN_SEED_PASSWORD: ci-owner-password-123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Dev fixtures for dashboard and orders
        run: pnpm db:seed:fixtures
        env:
          ZAYNA_SEED_FIXTURES: "1"

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - run: pnpm install --frozen-lockfile

      - name: Sync the web loader into the Android project
        run: pnpm android:sync
        env:
          # Optional repository variable. Without it the APK builds and shows the configuration message.
          APP_URL: ${{ vars.APP_URL }}

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zayna-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
