<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Zayna</title>
    <style>
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff8f3;
        color: #1d1b18;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      main { max-width: 320px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 12px; font-family: Georgia, serif; font-weight: 600; color: #755b00; }
      p { margin: 8px 0; font-size: 15px; line-height: 22px; }
      button {
        min-height: 48px;
        padding: 0 24px;
        margin-top: 12px;
        border: 1px solid #997a15;
        border-radius: 8px;
        background: #c9a227;
        color: #1d1b18;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zayna</h1>
      <p id="status">Ouverture du tableau de bord…</p>
      <p id="offline" hidden>Connexion impossible. Vérifiez votre réseau, puis réessayez.</p>
      <p id="unconfigured" hidden>L’adresse du serveur n’est pas configurée. Prévenez le responsable de l’application.</p>
      <button id="retry" type="button" hidden>Réessayer</button>
    </main>
    <script src="app-config.js"></script>
    <script>
      (function () {
        var url = window.ZAYNA_ADMIN_URL;
        var status = document.getElementById("status");
        var offline = document.getElementById("offline");
        var unconfigured = document.getElementById("unconfigured");
        var retry = document.getElementById("retry");

        function showProblem(element) {
          status.hidden = true;
          element.hidden = false;
          retry.hidden = false;
        }

        if (!url) {
          unconfigured.hidden = false;
          status.hidden = true;
          return;
        }

        retry.addEventListener("click", function () {
          location.replace(url);
        });

        if (!navigator.onLine) {
          showProblem(offline);
          return;
        }

        // If the back-office has not answered after 20 seconds, show the offline message with a retry button.
        var timer = setTimeout(function () {
          showProblem(offline);
        }, 20000);
        window.addEventListener("pagehide", function () {
          clearTimeout(timer);
        });

        location.replace(url);
      })();
    </script>
  </body>
</html>
